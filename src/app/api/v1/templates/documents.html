{% for doc in documents %}
  {% if loop.last and not last_page %}
  <tr hx-get="{{url_for('api_docs')}}?scope={{scope}}&page={{page+1}}"
      hx-trigger="revealed once"
      hx-swap="beforeend">
  </tr>
  {% else %}
  <tr>
    <td>{{offset+loop.index}}</td>
    <td><a href="{{url_for('doc',document_id=doc.id)}}">{{doc.name_document}} </a></td>
    <td>{{ "🧑" if doc.type== "manual" else "🤖"  }}{{doc.model}} </td>
    <td>{{doc.text}}</td>
    <td>
      <div class="flex gap-2">
              <!-- View Document -->
              <a href="{{url_for('doc',document_id=doc.id)}}" target="_blank" class="link-primary" title="Ver documento">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                  <path d="M6.22 8.72a.75.75 0 0 0 1.06 1.06l5.22-5.22v1.69a.75.75 0 0 0 1.5 0v-3.5a.75.75 0 0 0-.75-.75h-3.5a.75.75 0 0 0 0 1.5h1.69L6.22 8.72Z" />
                  <path d="M3.5 6.75c0-.69.56-1.25 1.25-1.25H7A.75.75 0 0 0 7 4H4.75A2.75 2.75 0 0 0 2 6.75v4.5A2.75 2.75 0 0 0 4.75 14h4.5A2.75 2.75 0 0 0 12 11.25V9a.75.75 0 0 0-1.5 0v2.25c0 .69-.56 1.25-1.25 1.25h-4.5c-.69 0-1.25-.56-1.25-1.25v-4.5Z" />
                </svg>
              </a>
             
              {% if scope == 'mydocs' %}
              <!-- Delete Document Button (opens modal) -->
              <button 
                @click="openModal({
                  id: '{{doc.id}}',
                  name: '{{doc.name_document}}',
                  deleteUrl: '{{url_for('api_delete_doc', document_id=doc.id)}}'
                })"
                class="link-primary" 
                title="Borrar documento">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
                  <path fill-rule="evenodd" d="M5 3.25V4H2.75a.75.75 0 0 0 0 1.5h.3l.815 8.15A1.5 1.5 0 0 0 5.357 15h5.285a1.5 1.5 0 0 0 1.493-1.35l.815-8.15h.3a.75.75 0 0 0 0-1.5H11v-.75A2.25 2.25 0 0 0 8.75 1h-1.5A2.25 2.25 0 0 0 5 3.25Zm2.25-.75a.75.75 0 0 0-.75.75V4h3v-.75a.75.75 0 0 0-.75-.75h-1.5ZM6.05 6a.75.75 0 0 1 .787.713l.275 5.5a.75.75 0 0 1-1.498.075l-.275-5.5A.75.75 0 0 1 6.05 6Zm3.9 0a.75.75 0 0 1 .712.787l-.275 5.5a.75.75 0 0 1-1.498-.075l.275-5.5a.75.75 0 0 1 .786-.711Z" clip-rule="evenodd" />
                </svg>
              </button>
              {% endif %}
      </div>
    </td>
  </tr>
  {% endif %}
{% endfor %}
