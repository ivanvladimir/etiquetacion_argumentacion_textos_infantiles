[project]
name = "etiquetacion_argumentacion_textos_infantiles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.25.0",
    "asyncpg>=0.30.0",
    "crudadmin[redis]>=0.4.3",
    "fastapi-tailwind>=2.0.4a1",
    "fastapi[standard]>=0.121.1",
    "fastcrud==0.20.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown>=3.10",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "torch>=2.2.0",
    "transformers>=4.57.3",
    "uuid6>=2025.0.1",
    "meilisearch-python-sdk>=5.7.0",
    "dateparser>=1.2.2",
    "python-docx>=1.2.0",
    "humanize>=4.15.0",
    "fastapi-mail>=1.6.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
